[project]
name = "quant-backtest"
version = "0.1.0"
description = "A股量化回测系统:趋势跟踪 / 均值回复 / 多因子打分(瑞翼工坊招新二轮)"
requires-python = ">=3.10"
dependencies = [
    "akshare>=1.18.88",
    "pandas>=2.3.3",
    "matplotlib>=3.10.9",
    "flask>=3.1.3",
    "baostock>=0.9.4",
]

# uv 不把本项目当作可安装包(纯脚本项目),依赖直接装进 .venv
[tool.uv]
package = false

# 国内镜像:本机清华源 403,默认走阿里云
[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
